name: TougeTracker
options:
  bundleIdPrefix: com.tougetracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TougeTracker:
    type: application
    platform: iOS
    sources:
      - path: TougeTracker
        # The full-precision tiles are the source data and are ~166MB of JSON.
        # They are compiled down before shipping (scripts/compile-road-tiles.py)
        # and only the compressed copies are bundled.
        excludes:
          - "Resources/tiles"
    resources:
      - TougeTracker/Resources/road-tiles
    # Compiles the road tiles if they have not been compiled yet, and fails the
    # build if there is nothing to compile. Without this, building without
    # running scripts/compile-road-tiles.py first produced an app whose map was
    # silently empty, and the tests still passed.
    preBuildScripts:
      - name: Ensure road tiles
        path: scripts/ensure-road-tiles.sh
        basedOnDependencyAnalysis: false
    info:
      path: TougeTracker/Info.plist
      properties:
        CFBundleDisplayName: TougeTracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "TougeTracker shows your route, records your drive, and calls rally pacenotes using your location."
        NSLocationAlwaysAndWhenInUseUsageDescription: "TougeTracker keeps recording your drive and calling pacenotes in the background while you drive."
        NSMotionUsageDescription: "TougeTracker uses the gyroscope and accelerometer to measure acceleration, braking, and g-forces."
        UIBackgroundModes:
          - location
        # The app is dark-only. Set here as well as via
        # `.preferredColorScheme(.dark)`: this key is what darkens the
        # UIKit-backed chrome (nav bars, sheets, alerts) and anything hosted
        # outside the SwiftUI scene, and unlike the modifier it cannot be
        # lost by a view that overrides the environment.
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tougetracker.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Personal Team: a free Apple ID is enough to run on your own device, no
        # paid membership required. Xcode regenerates the profile and the app
        # expires after ~7 days, so it needs reinstalling weekly.
        DEVELOPMENT_TEAM: 8M9TF7G7G5
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TougeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TougeTrackerTests
        excludes:
          - "Fixtures"
      - path: TougeTrackerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TougeTracker
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TougeTracker.app/TougeTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TougeTracker:
    build:
      targets:
        TougeTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TougeTrackerTests
