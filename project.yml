name: TougeTracker
options:
  bundleIdPrefix: com.tougetracker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  TougeTracker:
    type: application
    platform: iOS
    sources:
      - path: TougeTracker
    resources:
      - TougeTracker/Resources/tiles
    info:
      path: TougeTracker/Info.plist
      properties:
        CFBundleDisplayName: TougeTracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "TougeTracker shows your route, records your drive, and calls rally pacenotes using your location."
        NSLocationAlwaysAndWhenInUseUsageDescription: "TougeTracker keeps recording your drive and calling pacenotes in the background while you drive."
        NSMotionUsageDescription: "TougeTracker uses the gyroscope and accelerometer to measure acceleration, braking, and g-forces."
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tougetracker.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  TougeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TougeTrackerTests
        excludes:
          - "Fixtures"
      - path: TougeTrackerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TougeTracker
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TougeTracker.app/TougeTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TougeTracker:
    build:
      targets:
        TougeTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TougeTrackerTests
